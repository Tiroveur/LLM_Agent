[project]
name = "agentllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "langchain>=1.4.4",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pydantic>=2.14.0",
]

[project.scripts]
agentllm = "agentllm:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
